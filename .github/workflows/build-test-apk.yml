name: Build SAAM Sports test APK

on:
  push:
    branches: [main]
    paths:
      - ".build-payload/**"
      - ".github/workflows/build-test-apk.yml"

permissions:
  contents: read

concurrency:
  group: saam-android-debug-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reassemble uploaded native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .build-payload
          shopt -s nullglob
          chunks=(.build-payload/part-*.b64)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" | tr -d '\n' | base64 --decode > /tmp/saam-source.zip
          unzip -tq /tmp/saam-source.zip
          mkdir -p /tmp/saam-source
          unzip -q /tmp/saam-source.zip -d /tmp/saam-source
          test -d /tmp/saam-source/saam_android_review
          cp -a /tmp/saam-source/saam_android_review/. .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 QPR2 SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Create local debug signing key
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SAAM-Sports-test-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
